<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGROS - Kirish</title>
  <style>
    /* LOADER STYLE */
    #loader {
      background: linear-gradient(135deg, #1b5e20 0%, #4caf50 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    .loader {
      animation: rotate 1s infinite;
      height: 50px;
      width: 50px;
    }

    .loader:before,
    .loader:after {
      border-radius: 50%;
      content: "";
      display: block;
      height: 20px;
      width: 20px;
    }

    .loader:before {
      animation: ball1 1s infinite;
      background-color: #fff;
      box-shadow: 30px 0 0 #81c784;
      margin-bottom: 10px;
    }

    .loader:after {
      animation: ball2 1s infinite;
      background-color: #81c784;
      box-shadow: 30px 0 0 #fff;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg) scale(0.8); }
      50% { transform: rotate(360deg) scale(1.2); }
      100% { transform: rotate(720deg) scale(0.8); }
    }

    @keyframes ball1 {
      0% { box-shadow: 30px 0 0 #81c784; }
      50% {
        box-shadow: 0 0 0 #81c784;
        margin-bottom: 0;
        transform: translate(15px, 15px);
      }
      100% {
        box-shadow: 30px 0 0 #81c784;
        margin-bottom: 10px;
      }
    }

    @keyframes ball2 {
      0% { box-shadow: 30px 0 0 #fff; }
      50% {
        box-shadow: 0 0 0 #fff;
        margin-top: -20px;
        transform: translate(15px, 15px);
      }
      100% {
        box-shadow: 30px 0 0 #fff;
        margin-top: 0;
      }
    }

    /* LOGIN STYLE */
    * {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1b5e20, #4caf50);
      padding: 20px;
    }

    h4 {
      font-size: 24px;
      font-weight: 600;
      color: #000;
      opacity: .85;
    }

    label {
      font-size: 12.5px;
      color: #000;
      opacity: .8;
      font-weight: 400;
    }

    form {
      padding: 40px 30px 20px;
      background: #fefefe;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
      max-width: 400px;
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(0,0,0,.1), 0 5px 15px rgba(0,0,0,.07);
      transition: transform 0.3s ease;
    }

    form:hover {
      transform: translateY(-5px);
    }

    form h4 {
      margin-bottom: 20px;
      color: rgba(0,0,0,.5);
      align-self: center;
    }

    form h4 span {
      color: #1b5e20;
      font-weight: 700;
    }

    form p {
      line-height: 155%;
      margin-bottom: 40px;
      font-size: 14px;
      color: #000;
      opacity: .65;
      font-weight: 400;
      max-width: 100%;
      text-align: center;
      align-self: center;
    }

    a.discrete {
      color: rgba(0,0,0,.4);
      font-size: 14px;
      border-bottom: solid 1px transparent;
      padding-bottom: 4px;
      margin-left: auto;
      font-weight: 300;
      transition: all .3s ease;
      margin-top: 40px;
      text-decoration: none;
    }

    a.discrete:hover {
      border-bottom: solid 1px rgba(0,0,0,.2);
    }

    button {
      -webkit-appearance: none;
      min-width: 100px;
      border-radius: 24px;
      text-align: center;
      padding: 15px 40px;
      margin-top: 5px;
      background: linear-gradient(135deg, #1b5e20, #4caf50);
      color: #fff;
      font-size: 14px;
      margin-left: auto;
      font-weight: 500;
      box-shadow: 0px 2px 6px -1px rgba(0,0,0,.13);
      border: none;
      transition: all .3s ease;
      outline: 0;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 14px rgba(0,0,0,.1), 0 3px 6px rgba(0,0,0,.08);
    }

    button:active {
      transform: scale(.99);
    }

    input {
      font-size: 16px;
      padding: 20px 0px;
      height: 56px;
      border: none;
      border-bottom: solid 1px rgba(0,0,0,.1);
      background: #fff;
      width: 100%;
      box-sizing: border-box;
      transition: all .3s linear;
      color: #000;
      font-weight: 400;
      -webkit-appearance: none;
    }

    input:focus {
      border-bottom: solid 1px #1b5e20;
      outline: 0;
      box-shadow: 0 2px 6px -8px rgba(27, 94, 32, 0.45);
    }

    .floating-label {
      position: relative;
      margin-bottom: 10px;
      width: 100%;
    }

    .floating-label label {
      position: absolute;
      top: calc(50% - 7px);
      left: 0;
      opacity: 0;
      transition: all .3s ease;
      padding-left: 44px;
    }

    .floating-label input {
      width: calc(100% - 44px);
      margin-left: auto;
      display: flex;
    }

    .floating-label .icon {
      position: absolute;
      top: 0;
      left: 0;
      height: 56px;
      width: 44px;
      display: flex;
    }

    .floating-label .icon svg {
      height: 30px;
      width: 30px;
      margin: auto;
      opacity: .15;
      transition: all .3s ease;
    }

    .floating-label input:not(:placeholder-shown) {
      padding: 28px 0px 12px 0px;
    }

    .floating-label input:not(:placeholder-shown) + label {
      transform: translateY(-10px);
      opacity: .7;
    }

    .floating-label input:focus + label {
      color: #1b5e20;
    }

    .floating-label input:focus ~ .icon svg {
      opacity: .5;
      fill: #1b5e20;
    }

    .session {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 800px;
      margin: auto;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(0,0,0,.1), 0 5px 15px rgba(0,0,0,.07);
      overflow: hidden;
    }

    .left {
      width: 100%;
      height: 200px;
      background-image: url("https://images.pexels.com/photos/40568/medical-appointment-doctor-healthcare-40568.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1");
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .left::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(27, 94, 32, 0.7);
    }

    .left svg {
      height: 60px;
      width: auto;
      z-index: 1;
      filter: brightness(0) invert(1);
    }

    #main-content {
      display: none;
      width: 100%;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .error-message {
      color: #e74c3c;
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }

    @media (min-width: 768px) {
      .session {
        flex-direction: row;
      }
      .left {
        width: 40%;
        height: auto;
      }
      form {
        width: 60%;
        max-width: none;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Loader -->
  <div id="loader">
    <span class="loader"></span>
  </div>

  <!-- Login sahifasi -->
  <div id="main-content">
    <div class="session">
      <div class="left">
        <svg viewBox="0 0 300 302.5" xmlns="http://www.w3.org/2000/svg">
          <path fill="#fff" d="m126 302.2c-2.3 0.7-5.7 0.2-7.7-1.2l-105-71.6c-2-1.3-3.7-4.4-3.9-6.7l-9.4-126.7c-0.2-2.4 1.1-5.6 2.8-7.2l93.2-86.4c1.7-1.6 5.1-2.6 7.4-2.3l125.6 18.9c2.3 0.4 5.2 2.3 6.4 4.4l63.5 110.1c1.2 2 1.4 5.5 0.6 7.7l-46.4 118.3c-0.9 2.2-3.4 4.6-5.7 5.3l-121.4 37.4z"/>
        </svg>
      </div>
      <form class="log-in" autocomplete="off">
        <h4>AGROS <span>Tibbiy</span></h4>
        <p>Admin tomonidan berilgan parolini kiriting!</p>

        <div class="floating-label">
          <input placeholder="Parol" type="password" name="password" id="password" autocomplete="off" required />
          <label for="password">Parol:</label>
          <div class="icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M19,21H5V9h14V21z M6,20h12V10H6V20z"/>
              <path d="M16.5,10h-1V7c0-1.9-1.6-3.5-3.5-3.5S8.5,5.1,8.5,7v3h-1V7c0-2.5,2-4.5,4.5-4.5s4.5,2,4.5,4.5V10z"/>
            </svg>
          </div>
          <div class="error-message" id="password-error">Parol kamida 6 ta belgidan iborat bo'lishi kerak!</div>
        </div>

        <button type="submit">Kirish</button>
        <a href="test.html" class="discrete">Test rejimi (parolsiz)</a>
      </form>
    </div>
  </div>

  <script>
    // Loader 2 soniya → login chiqadi
    window.addEventListener("load", () => {
      setTimeout(() => {
        document.getElementById("loader").style.opacity = "0";
        setTimeout(() => {
          document.getElementById("loader").style.display = "none";
          document.getElementById("main-content").style.display = "block";
        }, 500);
      }, 2000);
    });

    // Forma yuborilganda
    document.querySelector('form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const password = document.getElementById('password').value.trim();
      const passwordError = document.getElementById('password-error');
      const input = document.getElementById('password');

      if (password.length < 6) {
        passwordError.style.display = 'block';
        input.style.borderBottomColor = '#e74c3c';
      } else {
        passwordError.style.display = 'none';
        input.style.borderBottomColor = '#1b5e20';

        // menu.html ga o'tish
        window.location.href = 'imenu.html';
      }
    });

    // Parol kiritilganda xatoni yashirish
    document.getElementById('password').addEventListener('input', function() {
      if (this.value.length >= 6) {
        document.getElementById('password-error').style.display = 'none';
        this.style.borderBottomColor = '#1b5e20';
      }
    });
  </script>
</body>
</html>
